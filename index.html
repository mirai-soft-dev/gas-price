<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 주유소 유가 정보</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="w-full mx-auto bg-white shadow-md p-2 space-y-3">
        <h1 class="text-base font-bold text-gray-800 px-1">전국 주유소 유가 비교</h1>

        <!-- 선택창 (지역 + 유종) -->
        <div class="flex gap-1 px-1">
            <select id="oil-type-select" class="p-1.5 border border-gray-300 rounded-md w-1/2 bg-blue-50 text-sm font-bold text-blue-800">
                <option value="gasoline">휘발유</option>
                <option value="premium">고급휘발유</option>
                <option value="diesel">경유</option>
                <option value="kerosene">등유</option>
                <option value="lpg">부탄</option>
            </select>
            <select id="region-select" class="p-1.5 border border-gray-300 rounded-md w-1/2 bg-white text-sm">
                <option value="ALL">전국 평균</option>
                <option value="01">서울</option>
                <option value="02">부산</option>
                <option value="03">대구</option>
                <option value="04">인천</option>
                <option value="05">광주</option>
                <option value="06">대전</option>
                <option value="07">울산</option>
                <option value="08">경기</option>
                <option value="09">강원</option>
                <option value="10">충북</option>
                <option value="11">충남</option>
                <option value="12">전북</option>
                <option value="13">전남</option>
                <option value="14">경북</option>
                <option value="15">경남</option>
                <option value="16">제주</option>
                <option value="17">세종</option>
            </select>
        </div>

        <!-- 차트 영역 -->
        <div class="bg-white p-1 rounded-lg border border-gray-200">
            <div class="h-64">
                <canvas id="regionComparisonChart"></canvas>
            </div>
        </div>

        <!-- 테이블 영역 -->
        <div class="overflow-x-auto">
            <table class="w-full text-[10px] text-center border-collapse">
                <thead class="bg-blue-50 text-blue-800">
                    <tr>
                        <th class="p-1 border">지역</th>
                        <th class="p-1 border">고급</th>
                        <th class="p-1 border">휘발유</th>
                        <th class="p-1 border">경유</th>
                        <th class="p-1 border">등유</th>
                        <th class="p-1 border">부탄</th>
                    </tr>
                </thead>
                <tbody id="oil-table-body" class="divide-y text-gray-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        const oilData = {
            "ALL": { code: "ALL", name: "전국", premium: 2325, gasoline: 1861, diesel: 1845, kerosene: 1580, lpg: 1099 },
            "01": { code: "01", name: "서울", premium: 2410, gasoline: 1908, diesel: 1885, kerosene: 1620, lpg: 1120 },
            "02": { code: "02", name: "부산", premium: 2280, gasoline: 1843, diesel: 1825, kerosene: 1560, lpg: 1090 },
            "03": { code: "03", name: "대구", premium: 2270, gasoline: 1835, diesel: 1815, kerosene: 1550, lpg: 1085 },
            "04": { code: "04", name: "인천", premium: 2300, gasoline: 1848, diesel: 1830, kerosene: 1570, lpg: 1095 },
            "05": { code: "05", name: "광주", premium: 2290, gasoline: 1840, diesel: 1820, kerosene: 1565, lpg: 1088 },
            "06": { code: "06", name: "대전", premium: 2295, gasoline: 1839, diesel: 1822, kerosene: 1568, lpg: 1090 },
            "07": { code: "07", name: "울산", premium: 2275, gasoline: 1841, diesel: 1821, kerosene: 1560, lpg: 1087 },
            "08": { code: "08", name: "경기", premium: 2310, gasoline: 1858, diesel: 1840, kerosene: 1575, lpg: 1098 },
            "09": { code: "09", name: "강원", premium: 2340, gasoline: 1870, diesel: 1850, kerosene: 1590, lpg: 1105 },
            "10": { code: "10", name: "충북", premium: 2315, gasoline: 1860, diesel: 1842, kerosene: 1582, lpg: 1100 },
            "11": { code: "11", name: "충남", premium: 2320, gasoline: 1865, diesel: 1848, kerosene: 1585, lpg: 1102 },
            "12": { code: "12", name: "전북", premium: 2285, gasoline: 1845, diesel: 1825, kerosene: 1565, lpg: 1092 },
            "13": { code: "13", name: "전남", premium: 2290, gasoline: 1850, diesel: 1832, kerosene: 1570, lpg: 1095 },
            "14": { code: "14", name: "경북", premium: 2295, gasoline: 1848, diesel: 1830, kerosene: 1568, lpg: 1094 },
            "15": { code: "15", name: "경남", premium: 2288, gasoline: 1846, diesel: 1828, kerosene: 1566, lpg: 1093 },
            "16": { code: "16", name: "제주", premium: 2500, gasoline: 1950, diesel: 1930, kerosene: 1680, lpg: 1180 },
            "17": { code: "17", name: "세종", premium: 2305, gasoline: 1852, diesel: 1835, kerosene: 1572, lpg: 1096 }
        };

        let chart;
        const labels = { gasoline: '휘발유', premium: '고급휘발유', diesel: '경유', kerosene: '등유', lpg: '부탄' };

        function update() {
            const regionVal = document.getElementById('region-select').value;
            const oilVal = document.getElementById('oil-type-select').value;
            const data = oilData[regionVal];
            
            // 테이블 갱신
            document.getElementById('oil-table-body').innerHTML = `<tr><td class="p-1 border font-bold">${data.name}</td><td class="p-1 border">${data.premium}</td><td class="p-1 border">${data.gasoline}</td><td class="p-1 border">${data.diesel}</td><td class="p-1 border">${data.kerosene}</td><td class="p-1 border">${data.lpg}</td></tr>`;

            // 차트 갱신
            chart.data.datasets[0].label = labels[oilVal] + ' 가격(원)';
            chart.data.datasets[0].data = Object.values(oilData).map(d => d[oilVal]);
            chart.data.datasets[0].backgroundColor = Object.values(oilData).map(d => d.code === regionVal ? '#f97316' : '#3b82f6');
            chart.update();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ctx = document.getElementById('regionComparisonChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: { labels: Object.values(oilData).map(d => d.name), datasets: [{ label: '가격', data: [], backgroundColor: [] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { font: { size: 10 } } } } }
            });
            document.getElementById('region-select').addEventListener('change', update);
            document.getElementById('oil-type-select').addEventListener('change', update);
            update();
        });
    </script>
</body>
</html>
