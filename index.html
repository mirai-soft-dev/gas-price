<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 주유소 유가 정보</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #f4f4f4; }
        .plus { color: red; }
        .minus { color: blue; }
    </style>
</head>
<body>
    <h1>전국 주유소 평균 유가 정보</h1>
    <p id="update-time">데이터 로딩 중...</p>
    <table>
        <thead>
            <tr>
                <th>제품명</th>
                <th>평균가격</th>
                <th>전일대비</th>
            </tr>
        </thead>
        <tbody id="price-table">
            <!-- 데이터가 동적으로 삽입됩니다 -->
        </tbody>
    </table>

    <script>
        fetch('data/price.json')
            .then(response => response.json())
            .then(data => {
                const results = data.RESULT.OIL;
                const tbody = document.getElementById('price-table');
                const updateTime = document.getElementById('update-time');
                
                if (results.length > 0) {
                    updateTime.innerText = `기준일자: ${results[0].TRADE_DT}`;
                }

                tbody.innerHTML = '';
                results.forEach(item => {
                    let diffClass = '';
                    let diffText = item.DIFF;
                    if (parseFloat(item.DIFF) > 0) {
                        diffClass = 'plus';
                        diffText = `▲ ${item.DIFF}`;
                    } else if (parseFloat(item.DIFF) < 0) {
                        diffClass = 'minus';
                        diffText = `▼ ${Math.abs(item.DIFF)}`;
                    }

                    const row = `<tr>
                        <td>${item.PRODNM}</td>
                        <td>${Number(item.PRICE).toLocaleString()}원</td>
                        <td class="${diffClass}">${diffText}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('데이터 로드 실패:', error);
                document.getElementById('update-time').innerText = '데이터를 불러오지 못했습니다.';
            });
    </script>
</body>
</html>
