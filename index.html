<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 주유소 평균 유가 정보</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white shadow-sm py-6">
        <div class="max-w-3xl mx-auto px-4">
            <h1 class="text-2xl font-bold text-gray-900">⛽ 전국 주유소 평균 유가 정보</h1>
            <p id="update-time" class="text-sm text-gray-500 mt-1">데이터 로딩 중...</p>
            
            <!-- Region Selector -->
            <div class="mt-4">
                <select id="region-select" onchange="updateTable()" class="p-2 border border-gray-300 rounded-lg w-full bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="ALL">전국 평균</option>
                    <option value="01">서울</option>
                    <option value="02">부산</option>
                    <option value="03">대구</option>
                    <option value="04">인천</option>
                    <option value="05">광주</option>
                    <option value="06">대전</option>
                    <option value="07">울산</option>
                    <option value="08">경기</option>
                    <option value="09">강원</option>
                    <option value="10">충북</option>
                    <option value="11">충남</option>
                    <option value="12">전북</option>
                    <option value="13">전남</option>
                    <option value="14">경북</option>
                    <option value="15">경남</option>
                    <option value="16">제주</option>
                    <option value="17">세종</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="bg-white shadow-md rounded-lg overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider">
                            <th class="py-3 px-6 font-semibold">제품명</th>
                            <th class="py-3 px-6 font-semibold text-right">평균가격</th>
                            <th class="py-3 px-6 font-semibold text-right">전일대비</th>
                        </tr>
                    </thead>
                    <tbody id="price-table" class="divide-y divide-gray-200 text-sm">
                        <!-- 데이터가 동적으로 삽입됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-400">
        © mirai-soft-dev. Powered by Opinet API & GitHub Actions.
    </footer>

    <script>
        let globalData = {};

        fetch('data/price.json')
            .then(response => response.json())
            .then(data => {
                globalData = data;
                
                // 기준일자 표시 (전국 데이터 기준)
                if (data.ALL && data.ALL.RESULT.OIL.length > 0) {
                    const dt = data.ALL.RESULT.OIL[0].TRADE_DT;
                    if (dt) {
                        const formattedDate = `${dt.slice(0,4)}년 ${dt.slice(4,6)}월 ${dt.slice(6,8)}일`;
                        document.getElementById('update-time').innerText = `기준일자: ${formattedDate}`;
                    }
                }
                
                updateTable();
            })
            .catch(error => {
                console.error('데이터 로드 실패:', error);
                document.getElementById('update-time').innerText = '데이터를 불러오지 못했습니다.';
            });

        function updateTable() {
            const region = document.getElementById('region-select').value;
            const tbody = document.getElementById('price-table');
            
            let oilList = [];
            if (region === 'ALL') {
                if (globalData.ALL && globalData.ALL.RESULT) {
                    oilList = globalData.ALL.RESULT.OIL;
                }
            } else {
                if (globalData.AREA && globalData.AREA.RESULT) {
                    // 지역별 데이터 필터링 (AREA_CD 기준)
                    oilList = globalData.AREA.RESULT.OIL.filter(item => item.AREA_CD === region);
                }
            }

            tbody.innerHTML = '';
            
            if (!oilList || oilList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-gray-500">데이터가 없습니다.</td></tr>`;
                return;
            }

            oilList.forEach(item => {
                let diffClass = 'text-gray-500';
                let diffText = item.DIFF;
                const diffVal = parseFloat(item.DIFF);

                if (diffVal > 0) {
                    diffClass = 'text-red-500 font-semibold';
                    diffText = `▲ ${item.DIFF}`;
                } else if (diffVal < 0) {
                    diffClass = 'text-blue-500 font-semibold';
                    diffText = `▼ ${Math.abs(item.DIFF)}`;
                } else {
                    diffText = `-`;
                }

                const row = `<tr class="hover:bg-gray-50 transition-colors">
                    <td class="py-4 px-6 font-medium text-gray-900">${item.PRODNM}</td>
                    <td class="py-4 px-6 text-right font-semibold text-gray-800">${Number(item.PRICE).toLocaleString()}원</td>
                    <td class="py-4 px-6 text-right ${diffClass}">${diffText}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
