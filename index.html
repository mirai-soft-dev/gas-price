<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전국 주유소 유가 정보</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">지역별 주유소 유가 정보</h1>

        <!-- 지역 선택 드롭다운 -->
        <div class="mb-6">
            <label for="region-select" class="block text-sm font-medium text-gray-700 mb-2">지역 선택</label>
            <select id="region-select" class="p-2 border border-gray-300 rounded-lg w-full bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="ALL">전국 평균</option>
                <option value="01">서울</option>
                <option value="02">부산</option>
                <option value="03">대구</option>
                <option value="04">인천</option>
                <option value="05">광주</option>
                <option value="06">대전</option>
                <option value="07">울산</option>
                <option value="08">경기</option>
                <option value="09">강원</option>
                <option value="10">충북</option>
                <option value="11">충남</option>
                <option value="12">전북</option>
                <option value="13">전남</option>
                <option value="14">경북</option>
                <option value="15">경남</option>
                <option value="16">제주</option>
                <option value="17">세종</option>
            </select>
        </div>

        <!-- 유가 정보 테이블 -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">지역</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">고급휘발유</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">휘발유</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">자동차용경유</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">실내등유</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">자동차용부탄</th>
                    </tr>
                </thead>
                <tbody id="oil-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- 데이터가 동적으로 삽입됩니다 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const oilData = {
            "ALL": { name: "전국 평균", premium: "2,325.28", gasoline: "1,861.89", diesel: "1,845.34", kerosene: "1,580.95", lpg: "1,099.14" },
            "01": { name: "서울", premium: "2,410.00", gasoline: "1,908.43", diesel: "1,885.10", kerosene: "1,620.00", lpg: "1,120.00" },
            "02": { name: "부산", premium: "2,280.00", gasoline: "1,843.99", diesel: "1,825.00", kerosene: "1,560.00", lpg: "1,090.00" },
            "03": { name: "대구", premium: "2,270.00", gasoline: "1,835.01", diesel: "1,815.00", kerosene: "1,550.00", lpg: "1,085.00" },
            "04": { name: "인천", premium: "2,300.00", gasoline: "1,848.86", diesel: "1,830.00", kerosene: "1,570.00", lpg: "1,095.00" },
            "05": { name: "광주", premium: "2,290.00", gasoline: "1,840.00", diesel: "1,820.00", kerosene: "1,565.00", lpg: "1,088.00" },
            "06": { name: "대전", premium: "2,295.00", gasoline: "1,839.69", diesel: "1,822.00", kerosene: "1,568.00", lpg: "1,090.00" },
            "07": { name: "울산", premium: "2,275.00", gasoline: "1,841.00", diesel: "1,821.00", kerosene: "1,560.00", lpg: "1,087.00" },
            "08": { name: "경기", premium: "2,310.00", gasoline: "1,858.10", diesel: "1,840.00", kerosene: "1,575.00", lpg: "1,098.00" },
            "09": { name: "강원", premium: "2,340.00", gasoline: "1,870.00", diesel: "1,850.00", kerosene: "1,590.00", lpg: "1,105.00" },
            "10": { name: "충북", premium: "2,315.00", gasoline: "1,860.00", diesel: "1,842.00", kerosene: "1,582.00", lpg: "1,100.00" },
            "11": { name: "충남", premium: "2,320.00", gasoline: "1,865.00", diesel: "1,848.00", kerosene: "1,585.00", lpg: "1,102.00" },
            "12": { name: "전북", premium: "2,285.00", gasoline: "1,845.00", diesel: "1,825.00", kerosene: "1,565.00", lpg: "1,092.00" },
            "13": { name: "전남", premium: "2,290.00", gasoline: "1,850.00", diesel: "1,832.00", kerosene: "1,570.00", lpg: "1,095.00" },
            "14": { name: "경북", premium: "2,295.00", gasoline: "1,848.00", diesel: "1,830.00", kerosene: "1,568.00", lpg: "1,094.00" },
            "15": { name: "경남", premium: "2,288.00", gasoline: "1,846.00", diesel: "1,828.00", kerosene: "1,566.00", lpg: "1,093.00" },
            "16": { name: "제주", premium: "2,500.00", gasoline: "1,950.00", diesel: "1,930.00", kerosene: "1,680.00", lpg: "1,180.00" },
            "17": { name: "세종", premium: "2,305.00", gasoline: "1,852.00", diesel: "1,835.00", kerosene: "1,572.00", lpg: "1,096.00" }
        };

        function updateTable() {
            const selectElement = document.getElementById('region-select');
            
            if (!selectElement) {
                console.error("❌ 에러: 'region-select' ID를 가진 요소를 찾을 수 없습니다.");
                return;
            }

            const selectedCode = selectElement.value;
            console.log("👉 선택된 지역 코드 (value):", selectedCode);

            const data = oilData[selectedCode];
            console.log("👉 매칭된 데이터 객체:", data);

            const tbody = document.getElementById('oil-table-body');
            if (!tbody) {
                console.error("❌ 에러: 'oil-table-body' ID를 가진 요소를 찾을 수 없습니다.");
                return;
            }

            if (!data) {
                console.warn("⚠️ 경고: 해당 코드에 매칭되는 데이터가 없습니다.");
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">데이터가 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${data.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${data.premium}원</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${data.gasoline}원</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${data.diesel}원</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${data.kerosene}원</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${data.lpg}원</td>
                </tr>
            `;
            console.log("✅ 테이블 업데이트 완료");
        }

        // HTML 태그 내 onchange 대신 표준 자바스크립트 이벤트 리스너 부착
        document.addEventListener('DOMContentLoaded', () => {
            console.log("🚀 DOM 로드 완료, 이벤트 리스너 등록 중...");
            const selectElement = document.getElementById('region-select');
            
            if (selectElement) {
                selectElement.addEventListener('change', updateTable);
                console.log("✅ 'change' 이벤트 리스너 등록 성공");
            } else {
                console.error("❌ select 요소를 찾지 못해 이벤트를 걸 수 없습니다.");
            }

            // 최초 실행
            updateTable();
        });
    </script>
</body>
</html>
