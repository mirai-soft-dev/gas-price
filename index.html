<!-- <header> 내부 <h1> 아래에 추가 -->
<div class="mt-4">
    <select id="region-select" onchange="updateTable()" class="p-2 border rounded-lg w-full">
        <option value="ALL">전국 평균</option>
        <option value="01">서울</option>
        <option value="02">부산</option>
        <option value="03">대구</option>
        <option value="04">인천</option>
        <option value="08">경기</option>
        <!-- 필요시 다른 지역코드 추가 가능 -->
    </select>
</div>

<script>
    let globalData = {};

    fetch('data/price.json')
        .then(response => response.json())
        .then(data => {
            globalData = data;
            updateTable();
        });

    function updateTable() {
        const region = document.getElementById('region-select').value;
        const tbody = document.getElementById('price-table');
        const updateTime = document.getElementById('update-time');
        
        let oilList = [];
        if (region === 'ALL') {
            oilList = globalData.ALL.RESULT.OIL;
        } else {
            // 지역 데이터 필터링
            oilList = globalData.AREA.RESULT.OIL.filter(item => item.AREA_CD === region);
        }

        tbody.innerHTML = '';
        oilList.forEach(item => {
            // ... (기존 테이블 생성 로직 동일)
            const row = `<tr>...</tr>`;
            tbody.innerHTML += row;
        });
    }
</script>
